[package]
name = "channel"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fawdlstty/channel"
homepage = "https://github.com/fawdlstty/channel"
description = "A channel for AI coding harnesses"
authors = ["fawdlstty<f@fawdlstty.com>"]
keywords = ["agent", "harness"]
categories = []
readme = "README.md"
exclude = ["src/main.rs"]

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.28"
toml = "1"

# cargo publish -p channel --allow-dirty --registry crates-io
# cd docs && npm run docs:build && cd ..
